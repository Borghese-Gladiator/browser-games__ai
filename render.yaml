services:
  - type: web
    name: browser-games
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # /healthz is purpose-built and side-effect free. /stats rolls up the
    # message-rate window on every call, so a probe against it would skew the
    # metric it reports.
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
