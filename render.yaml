services:
  - type: web
    name: browser-games
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # /healthz is purpose-built and side-effect free. /api/leaderboard runs
    # outcomeStore.all() plus a full computeBoard() on every probe, and that
    # cost grows with match history.
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
